name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - id: tests
        continue-on-error: true
        run: uv run pytest
      - name: Diagnose dock capabilities
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_workspace_panes_are_movable_docks
      - name: Diagnose background callback
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_background_result_reaches_the_ui_and_releases_its_worker
      - name: Diagnose context highlight
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_context_marks_the_changed_cell_and_its_headers
      - name: Diagnose row selection
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_switching_columns_in_the_same_row_does_not_restart_work
      - name: Diagnose dock persistence
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_dock_layout_is_restored_after_reopening
      - name: Diagnose default layout
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_default_layout_action_restores_docks_and_column_widths
      - name: Diagnose resizable columns
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_every_table_column_can_be_resized_by_the_user
      - name: Diagnose column persistence
        if: runner.os == 'Windows' && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: >-
          uv run pytest
          tests/test_ui_threads.py::test_fixed_table_column_widths_are_restored_after_reopening
      - name: Fail after test diagnostics
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: Smoke test the Qt window
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          uv run python -c
          "from excel_git_viewer.ui import create_application;
          app, window = create_application(); window.close()"
