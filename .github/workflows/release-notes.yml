name: Publish Release Notes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-notes.yml"
      - "docs/releases/*.md"
  workflow_run:
    workflows: ["Release Windows x64"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-notes:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            tag="$(git tag --points-at "$RELEASE_SHA" --list 'v*' --sort=-version:refname | head -n 1)"
          else
            tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [[ -z "$tag" ]]; then
            echo "No release tag points at $RELEASE_SHA; skipping."
            exit 0
          fi
          notes="docs/releases/$tag.md"
          if [[ ! -f "$notes" ]]; then
            echo "No curated notes found at $notes; keeping generated notes."
            exit 0
          fi
          gh release edit "$tag" --notes-file "$notes"
