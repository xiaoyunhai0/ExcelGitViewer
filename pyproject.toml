[project]
name = "excel-git-viewer"
version = "0.1.1"
description = "Read-only Excel diffs for Git commits"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "pillow>=11.0,<12",
    "pyside6>=6.8,<7",
]

[project.gui-scripts]
excel-git-viewer = "excel_git_viewer.app:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pyinstaller>=6.12,<7",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "types-openpyxl>=3.1.5,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_git_viewer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["excel_git_viewer"]
